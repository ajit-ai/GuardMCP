name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (uv)
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"
          uv pip install --system -e ./packages/guardmcp-core
          uv pip install --system -e ./packages/guardmcp-context
          uv pip install --system -e ./packages/guardmcp-errors
          uv pip install --system -e ./packages/guardmcp-policy
          uv pip install --system -e ./packages/guardmcp-risk
          uv pip install --system -e ./packages/guardmcp-budget
          uv pip install --system -e ./packages/guardmcp-decision
          uv pip install --system -e ./packages/guardmcp-audit
          uv pip install --system -e ./packages/guardmcp-observability
          uv pip install --system -e ./packages/guardmcp-security
          uv pip install --system -e ./packages/guardmcp-proxy

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy packages

      - name: Tests
        run: pytest -q
