[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardmcp-policy"
version = "0.1.0"
description = "GuardMCP policy engine — Policy, Rule, Condition, Evaluator"
requires-python = ">=3.11"
dependencies = ["guardmcp-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/guardmcp_policy"]
