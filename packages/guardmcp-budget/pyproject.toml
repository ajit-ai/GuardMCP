[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardmcp-budget"
version = "0.1.0"
description = "GuardMCP budget engine — CHECK/RESERVE/CONSUME/RELEASE/EXPIRE"
requires-python = ">=3.11"
dependencies = ["guardmcp-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/guardmcp_budget"]
