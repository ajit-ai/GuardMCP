[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardmcp-risk"
version = "0.1.0"
description = "GuardMCP risk engine — deterministic, explainable"
requires-python = ">=3.11"
dependencies = ["guardmcp-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/guardmcp_risk"]
