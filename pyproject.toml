[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardmcp"
version = "0.1.0"
description = "GuardMCP — Trusted execution and security control layer for AI agents and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ajit Kumar", email = "ajitjava2@gmail.com" }]
keywords = ["mcp", "security", "governance", "ai-agent", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "types-requests",
]

[project.urls]
Homepage = "https://github.com/ajit-ai/GuardMCP"
Repository = "https://github.com/ajit-ai/GuardMCP"
Issues = "https://github.com/ajit-ai/GuardMCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["packages/guardmcp-core/src/guardmcp_core"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".git", ".venv", "dist", "build", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "TCH", "TID", "RUF"]
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["\\.venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/guardmcp-core/src",
    "packages/guardmcp-context/src",
    "packages/guardmcp-errors/src",
    "packages/guardmcp-policy/src",
    "packages/guardmcp-risk/src",
    "packages/guardmcp-budget/src",
    "packages/guardmcp-decision/src",
    "packages/guardmcp-audit/src",
    "packages/guardmcp-observability/src",
    "packages/guardmcp-security/src",
    "packages/guardmcp-proxy/src",
]
addopts = "-q --strict-markers --strict-config"
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "security: security tests",
  "e2e: end-to-end tests",
]

[tool.coverage.run]
source = [
    "packages/guardmcp-core/src",
    "packages/guardmcp-errors/src",
    "packages/guardmcp-policy/src",
    "packages/guardmcp-risk/src",
    "packages/guardmcp-budget/src",
    "packages/guardmcp-decision/src",
    "packages/guardmcp-audit/src",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
